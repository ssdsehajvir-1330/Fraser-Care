<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraserCare</title>

    <script src="/js/auth.js" defer></script>

    <style>
        nav {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: flex-end;
        }

        nav form {
            display: inline;
        }
    </style>
</head>
<body>
    <nav>
        <!-- Shown when nobody is logged in -->
        <span id="logged-out">
            <a href="/login.html">Login</a>
            <a href="/signup.html">Sign Up</a>
        </span>

        <!-- Shown when a user is logged in -->
        <span id="logged-in" hidden>
            Logged in as <strong class="user-name"></strong>
            <a id="my-page" href="/">My page</a>
            <form class="logout-form" action="/logout" method="post">
                <button type="submit">Log out</button>
            </form>
        </span>
    </nav>

    <h1>Welcome to FraserCare</h1>
    <p>Pharmacy Service Management Platform</p>
    <p>CMPT 276 Group Project</p>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = await getCurrentUser();

            if (!user) {
                return;
            }

            document.getElementById("logged-out").hidden = true;
            document.getElementById("logged-in").hidden = false;
            document.getElementById("my-page").href = landingPageFor(user);

            await setUpLoggedInPage();
        });
    </script>
</body>
</html>
